<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Widget RSS Feed Scrollable</title>
    <style>
      /* Mengatur tampilan box agar rapi dan pas dengan iframe */
      body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        margin: 0; 
        padding: 15px; 
        background: #ffffff; 
      }
      h3 {
        margin-top: 0;
        margin-bottom: 15px;
        color: #333;
        font-size: 1.1rem;
        position: sticky; /* Membikin judul tetap diam di atas saat di-scroll */
        top: 0;
        background: #ffffff;
        padding-bottom: 5px;
      }
      ul { 
        padding-left: 20px; 
        margin: 0;
      }
      li {
        margin-bottom: 12px;
        line-height: 1.4;
      }
      a { 
        color: #0056b3; 
        text-decoration: none; 
        font-size: 0.95rem;
      }
      a:hover { 
        text-decoration: underline; 
      }
    </style>
</head>
<body>

    <div id="rel">Memuat...</div>

    <script>
    // URL Feed yang sudah diperbarui
    const x = [
      "https://blogeespss.blogspot.com/feeds/posts/default",
      "https://ansyahsoslo.blogspot.com/feeds/posts/default" // <-- Sudah diganti ke ansyahsoslo
      // ... kamu tinggal tambah domain 10+ lainnya di bawah ini ...
    ];

    const g = u => fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(u)).then(r => r.json());

    (async () => {
      try {
        let e = await Promise.all(x.map(g));
        let a = [];
        
        // Mengambil masing-masing 2 artikel dari tiap website
        e.map(r => a.push(...(r?.items?.slice(0, 2) || [])));
        
        // Mengacak artikel, lalu memotongnya hanya ambil 20 judul teratas saja
        let artikelAcak = a.sort(() => Math.random() - .5).slice(0, 20);
        
        document.getElementById('rel').innerHTML = "<h3>Artikel Terkait</h3><ul>" + 
          artikelAcak.map(i => `<li><a href="${i.link}" target="_blank" rel="noopener">${i.title}</a></li>`).join("") + 
          "</ul>";
      } catch (error) {
        console.error("Gagal memuat feed:", error);
        document.getElementById('rel').innerHTML = ""; 
      }
    })();
    </script>

</body>
</html>
